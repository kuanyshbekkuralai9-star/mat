<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ежелгі Қытай философиясы: сарайға саяхат</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e2b659;--red:#b3261e;--ink:#120a08;--txt:#f1e4c8;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--txt);font-family:"Noto Serif",Georgia,serif;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.cn{font-family:"Ma Shan Zheng","Noto Serif",serif}
#gate{position:fixed;inset:0;z-index:40;overflow:hidden;background:#000}
#gate .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 2.6s cubic-bezier(.5,0,.2,1),filter 2.6s}
#gate.open .bg{transform:scale(1.7);filter:brightness(.35)}
#gate::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),transparent 30%,transparent 55%,rgba(0,0,0,.85))}
#gate.open{animation:fo 1s 1.9s forwards}
@keyframes fo{to{opacity:0;visibility:hidden}}
#gt{position:absolute;z-index:2;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);text-align:center;padding:0 18px}
#gt .cn{font-size:clamp(54px,12vw,96px);line-height:1;color:var(--gold);text-shadow:0 2px 24px #000}
#gt h1{margin:6px 0 4px;font-size:clamp(20px,4.6vw,32px);text-shadow:0 2px 12px #000}
#gt p{margin:0 0 18px;opacity:.85}
.btn{background:rgba(179,38,30,.92);border:1px solid var(--gold);padding:12px 28px;border-radius:2px;font-size:17px;box-shadow:0 0 30px rgba(226,182,89,.35)}
#game{position:fixed;inset:0}
.pg{position:absolute;inset:0;display:none;overflow:hidden}.pg.on{display:block}
.bd2{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(26px) brightness(.5)}
.fr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh*.6667));aspect-ratio:2/3;background-size:cover;background-position:center;box-shadow:0 0 70px #000;overflow:hidden}
.cap{position:absolute;left:0;right:0;top:9%;text-align:center;pointer-events:none;text-shadow:0 2px 12px #000}
.cap b{display:block;font-size:46px;font-weight:400;color:var(--gold);font-family:"Ma Shan Zheng",serif;opacity:.8}
.mist{position:absolute;left:-30%;width:160%;height:70px;background:linear-gradient(90deg,transparent,rgba(255,236,210,.4),transparent);animation:dr 24s linear infinite alternate;filter:blur(8px)}
@keyframes dr{to{transform:translateX(18%)}}
.hs{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:3}
.hs i{width:24px;height:24px;border-radius:50%;background:radial-gradient(#ffe9a8,#e2b659 60%,#8a5a12);border:2px solid #fff6d8;box-shadow:0 0 18px #e2b659;position:relative}
.hs i::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #ffd76a;animation:pu 1.9s infinite}
.hs.seen i{background:radial-gradient(#d6f5da,#5db36b 60%,#2d6b39);box-shadow:0 0 14px #5db36b}.hs.seen i::after{animation:none;opacity:0}
@keyframes pu{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.9);opacity:0}}
.hs span{background:rgba(18,10,8,.74);backdrop-filter:blur(6px);border:1px solid rgba(226,182,89,.6);color:#ffeec2;font-size:12px;padding:3px 8px;border-radius:2px;white-space:nowrap}
#bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(rgba(0,0,0,.8),transparent);z-index:6;font-size:14px}
#bar b{flex:1;color:var(--gold);font-weight:400;font-size:21px}
#bar button{background:rgba(18,10,8,.6);border:1px solid var(--gold);border-radius:2px;padding:4px 10px}
#pb{width:60px;height:4px;background:#ffffff30}#pb div{height:100%;width:0;background:var(--gold);transition:width .6s}
#nav{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:center;align-items:center;gap:10px;z-index:6}
#nav button{background:rgba(18,10,8,.75);border:1px solid var(--gold);padding:9px 16px;border-radius:2px;font-size:14px}
#nav #fw{background:rgba(179,38,30,.92)}#nav .glow{animation:gl 1.4s infinite alternate}
@keyframes gl{to{box-shadow:0 0 22px 4px #e2b659}}
#pn{font-size:12px;opacity:.85;text-shadow:0 1px 6px #000;max-width:30vw;text-align:center}
#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);text-align:center;font-size:12.5px;z-index:5;pointer-events:none;text-shadow:0 1px 6px #000;padding:0 16px}
#doors{position:fixed;inset:0;z-index:35;pointer-events:none;display:flex}#doors.shut{pointer-events:all}
#doors div{width:50%;height:100%;background:radial-gradient(circle,#e2b659 0 4px,transparent 5px) 0 0/46px 46px,linear-gradient(90deg,#4a2113,#2e130a);transition:transform 2.6s cubic-bezier(.6,0,.3,1);box-shadow:inset 0 0 60px #000}
#doors .l{transform:translateX(-101%);border-right:5px solid var(--gold)}#doors .r{transform:translateX(101%);border-left:5px solid var(--gold)}
#doors.shut div{transform:none;transition:transform .9s cubic-bezier(.5,0,1,.6)}
#modal{position:fixed;inset:0;background:rgba(5,2,1,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:14px;z-index:30}
#modal.on{display:flex}
#card{background:#1b110e;color:var(--txt);width:100%;max-width:580px;max-height:88%;overflow:auto;border:1px solid var(--gold);outline:5px solid #1b110e;box-shadow:0 0 0 7px var(--red),0 20px 60px #000}
.hd{height:120px;display:flex;align-items:flex-end;padding:14px 20px;background-color:#3a1612}
.hd h2{margin:0;font-size:22px;line-height:1.2;color:var(--gold);text-shadow:0 2px 10px #000}
.bd{padding:6px 20px 18px}.sub{font-size:13px;opacity:.65;margin-bottom:6px}
.bd p{line-height:1.65;margin:9px 0}
.fact{background:rgba(226,182,89,.14);border-left:3px solid var(--gold);padding:9px 12px;margin-top:12px;line-height:1.6}
table{border-collapse:collapse;width:100%;font-size:14px}td{border:1px solid rgba(226,182,89,.3);padding:5px 8px;vertical-align:top}td:first-child{font-weight:700;white-space:nowrap;color:var(--gold)}
.nv{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.nv button{background:var(--red);border:0;padding:9px 18px;border-radius:2px;color:#fff}.nv button:disabled{opacity:.3}.nv .x{background:#4a3a2e}
@media(max-width:600px){#modal{align-items:flex-end;padding:0}#card{max-height:86%}}
</style>
</head>
<body>
<div id="gate"><div class="bg" id="gbg"></div>
 <div id="gt"><div class="cn">天下</div><h1>Ұлы қақпа</h1><p>Ежелгі Қытай философиясына саяхат</p><button class="btn" id="enter">Қақпадан кіру</button></div>
</div>
<div id="game">
 <div id="bar"><b class="cn">天下 · Сарай</b><div id="pb"><div></div></div><span id="prog"></span><button id="snd">🔊</button></div>
 <div id="hint"></div>
 <div id="nav"><button id="bk">‹ Артқа</button><span id="pn"></span><button id="fw">Келесі бөлме ›</button></div>
</div>
<div id="doors"><div class="l"></div><div class="r"></div></div>
<div id="modal"><div id="card"></div></div>
<script>
var D={
sky:{t:"Аспан және жауапкершілік",s:"Қытай дүниетанымы",n:[1,4,7],p:[
"<p>Ежелгі Қытай философиясы б.з.д. VI–III ғасырларда мифологияның негізінде пайда болды. Қытай өркениеті 5000 жыл бұрын пайда болған, ал б.з.д. 221 жылдан 1911 жылға дейін бүтін империя болып келді.</p><p>Қытай мемлекетін бүкіл әлемнің орталығы деп есептеген. Өз елін «Чжунго» (Орталық мемлекет) деп атаған.</p><p>Адамды, табиғатты, ғарышты біртұтастық ретінде қабылдаған.</p>",
"<p>Аспан мен жер алдында жер бетінде ғарыштық циклдердің дұрыс іске асырылуы үшін өзінің жауапкершілігін түсіну: адамның міндеті — әлемдік тәртіпті бұзбау.</p><p>Жеке оқиғаны емес, жалпы тарихты циклдік процесс ретінде қарастырған. О дүниедегі емес, осы тіршіліктегі өмірді құрметтеген.</p><div class='fact'><b>Қызықты:</b> «Аспан мандаты» (тянь-мин) ілімі бойынша билеуші әділ болмаса, Аспан өз мандатын одан алады. Халық көтерілісі мен әулеттің құлауы осылай түсіндірілген.</div>"]},
conf:{t:"Конфуций және конфуцийшілдік",s:"Кун-фу-цзы (б.з.д. 551–479)",n:[0,2,4],p:[
"<p>Кун-фу-цзының ілімінде ең жоғары жаратушы күш — аспан. Ол қоғамдағы әділеттілікті, әртүрлі сатыдағы топтардың теңсіздігін қорғайды.</p><p>Басты мәселелер — адамдар арасындағы қарым-қатынас, тәрбие. Конфуцийшілдіктің негізгі мәселелері: мемлекет пен қоғамды басқару, адам және оның өзіндік этикасы.</p><p><b>Қайырымды адам</b> ілімі: адамды қайырымды етіп тәрбиелеуге болады. Қайырымдылықтың өзегі — <b>Жэнь</b> (адамгершілік), <b>Сяо</b> (үлкенге құрмет), <b>Ли</b> (әдеп), <b>И</b> (әділеттілік).</p>",
"<p>Жетілген адам — <b>цзюнь-цзы</b> («ізгі адам»), жетілмеген — <b>сяо-жень</b> («ұсақ адам»). Мэн-цзы Кун-фу-цзы ілімін жалғастырып, Тағдырды (Мин) аспан еркі деп түсіндірді. Конфуцийшілдер қарияларды, жасы үлкендерді құрметтеуді басты орынға қойды.</p><div class='fact'><b>Қызықты:</b> «Өзіңе қаламағанды өзгеге жасама» деген «алтын ереже» осы ілімнің «Лунь юй» кітабында айтылған. Тайваньда Конфуцийдің туған күні (28 қыркүйек) Ұстаздар күні ретінде аталады.</div>"]},
mozi:{t:"Моизм: жалпыға бірдей қамқорлық",s:"Мо-цзы (б.з.д. V ғасыр)",n:[2,5,6],p:[
"<p>Конфуцийшілдікпен қатар Ежелгі Қытайда моизм, легизм, даосизм, натурфилософия, номинализм бағыттары қалыптасты.</p><p>Мо-цзы бойынша адамдар бір-бірін туысындай сүйіп, қамқор болуы керек. Бұл — «жалпыға бірдей қамқорлық» идеясы. Ол ұлы мен кішіні, жақын мен алысты бөлмеуді, соғыстан бас тартуды талап етті.</p>",
"<p>Мо-цзы үшін ілімнің бағасы — оның пайдасы: егер идея халыққа игілік әкелмесе, ол қажетсіз.</p><div class='fact'><b>Қызықты:</b> Моистер қолөнершілер мен жауынгерлердің ортасынан шыққан деседі. Олар қорғаныс құрылыстарын жасауда шебер болған, тек қорғанысты ғана қолдаған.</div>"]},
yy:{t:"Инь-Ян және Ци",s:"Қарама-қарсылықтар үйлесімі",n:[3,5,7],p:[
"<table><tr><td>Инь-Ян</td><td>Қарама-қарсы күштер, екі жақтылық: түнек-жарық, тыныштық-қозғалыс, жер-аспан, әйелдік-еркектік және т.б.</td></tr><tr><td>Ци</td><td>Өмірлік энергия, рухани күш, эфир</td></tr></table><p>Дао мен дэ арқылы әлемдегі заттардың өмір сүру заңы: Әлемдегі денелер аспан (<b>ян</b>, ер) мен жер (<b>инь</b>, әйел) арқасында гармонияда бірлікте болады.</p>",
"<p>Инь мен ян бір-бірін жоққа шығармайды, бір-бірін толықтырады. Күн мен түн, жаз бен қыс біріне-бірі ауысып тұрады.</p><div class='fact'><b>Қызықты:</b> Тайцзы белгісіндегі ақ пен қара бөліктің ішінде қарама-қарсы түстің нүктесі бар: әр күштің ішінде екіншісінің дәні жатыр. Қытай медицинасы мен фэншуй осы идеяға сүйенеді.</div>"]},
legal:{t:"Легизм: заң мен тәртіп",s:"Фацзя мектебі",n:[0,4,6],p:[
"<p>Легизм — «заң» туралы ілім. Ерте қытайдағы саяси-этикалық ілім, қоғамды және мемлекетті басқару туралы көзқарастар жиынтығы. Өкілдері: Цзы Чань (б.з.д. VI ғ.), Гуань Чжун, Шан Ян (б.з.д. 390–338), Хань Фэй цзы (шамамен б.з.д. 280–233), Ли Куй және т.б.</p><p>Конфуцийшілдер <b>жэнь</b> мен <b>ли</b> принципін ұсынса, легистер оның орнына заңға (<b>фа</b>) сүйенген мемлекеттік реформа ұсынды.</p>",
"<p>Легистер бойынша мемлекетті тек қана заң басқаруы керек, мақсат — елде тәртіп орнату. Адамдарды жазамен қорқыту мен сыйлықпен ынталандыру арқылы басқаруға болады.</p><div class='fact'><b>Қызықты:</b> Легизмге сүйенген Цинь мемлекеті б.з.д. 221 жылы Қытайды біріктірді. Кейінгі Хань империясы конфуцийшілдікті ресми идеологияға айналдырды, бірақ заң әдістерін қалдырды.</div>"]},
dao:{t:"Даосизм және Лао-цзы",s:"«Дао дэ цзин» (б.з.д. VI–V ғасыр)",n:[1,3,5],p:[
"<p>Даосизмнің негізін қалаушы — Лао-цзы, ал негізгі еңбегі «Дао дэ цзин». <b>Дао</b> — «жол» деген мағына береді: дүниенің қайнар көзі, алғашқы негіз, аспан заңдылықтары.</p><p><b>Дэ</b> — Дао туғызған болмыс, заттардың мүмкіндігі.</p><p><b>У вэй</b> — заттың табиғи қалыптасуына килікпеу, еш нәрсе істемеу. Адам табиғи ағысқа қарсы тұрмай, Дао бойынша өмір сүруі керек.</p>",
"<p>Дао — барлық заттардың бастамасы, барлық құбылыстардың бірлігі. Дао мен дэ айырылмас: Дао заттарды дүниеге келтіреді, дэ оларды қоректендіреді.</p><div class='fact'><b>Қызықты:</b> «Дао дэ цзин» шамамен 5000 иероглифтен, 81 тарауден тұрады. Аңыз бойынша Лао-цзы шекара бекетінен кетерде бұл кітапты күзетшіге жазып қалдырған. Ол суды ең жоғары қасиет деп бағалаған: су жұмсақ, бірақ тасты да мүжиді.</div>"]},
book:{t:"Негізгі ұғымдар кітабы",s:"Ежелгі Қытай философиясының негізгі ұғымдары",n:[0,2,4],p:[
"<table><tr><td>Дао</td><td>Дүниенің қайнар көзі, алғашқы негіз; заттар мен құбылыстар оған бағынышты</td></tr><tr><td>Дэ</td><td>Дао тудырған болмыс; ізгілік және өлшемді таба білу қабілеті</td></tr><tr><td>Жэнь</td><td>Адамгершілік, рахымшылдық, ізгілік</td></tr><tr><td>И</td><td>Борыш сезімі, әділеттілік</td></tr><tr><td>Инь-Ян</td><td>Қарама-қарсы күштер, екі жақтылық</td></tr></table>",
"<table><tr><td>Ли</td><td>Салт жорасы, рәсім, әдеп, жүріс-тұрыс үлгілері</td></tr><tr><td>Чжи</td><td>Даналық, білім, ақыл, парасат</td></tr><tr><td>Сяо</td><td>Үлкендерге сый-құрмет</td></tr><tr><td>Ци</td><td>Өмірлік энергия, рухани күш, эфир</td></tr><tr><td>У вэй</td><td>Заттың табиғи қалыптасуына килікпеу</td></tr><tr><td>Цзюнь-цзы</td><td>Жетілген «ізгі адам», адам идеалы</td></tr><tr><td>Сяо-жень</td><td>Жетілмеген «ұсақ адам»</td></tr></table>"]},
throne:{t:"Император тағы",s:"Мемлекет басшысының орны",n:[0,3,7],p:[
"<p>Қола дәуірінен темір дәуіріне өтуге байланысты ауыл шаруашылығы мен қала тұрғындарының еңбектерінің бөлінуіне, әртүрлі сатыдағы әлеуметтік топтардың пайда болуына әкеліп соқтырды.</p><p>Ежелгі Қытай мемлекеті шын мәніндегі шығыстық деспотия болатын. Мемлекет басшысы әрі патша, әрі абыз және жалғыз ғана жер иесі болды.</p>",
"<p>Қоғамда вертикальды байланыстың қанат жаюы, адамаралық қатынастарда субординацияны ұстау, мемлекет басшысын керемет біріктіруші күш ретінде қабылдау қалыптасты. Жеке адамның әлсіздігін мойындап, ұжымның күшіне бас июге үйретті.</p><div class='fact'><b>Қызықты:</b> Император «Аспан ұлы» (тянь-цзы) аталды. Сары түс пен бес тырнақты айдаһар тек оған тиесілі болған. Кейін мемлекеттік шенеунік болу үшін конфуцийшілдік кітаптардан емтихан тапсыру керек болды.</div>"]},
trad:{t:"Дәстүр және қариялар",s:"Қытай дүниетанымының ерекшеліктері",n:[0,2,5],p:[

li:{t:"Ли: әдеп пен рәсім",s:"Адамдар арасындағы тәртіп",n:[0,2,4],p:[
"<p>Ли — салт жорасы, рәсім, әдеп, жүріс-тұрыс үлгілері. Конфуций үшін ли — қоғамды күшпен емес, әдеппен ұстап тұру тәсілі. Әр адам өз орнын біледі: кімге қалай сәлем беру, қалай сөйлесу, қалай отыру — бәрі белгіленген.</p><p>Конфуцийшілдер бес негізгі қатынасты атаған: билеуші мен бағынушы, әке мен бала, ері мен әйелі, аға мен іні, дос пен дос. Алғашқы төртеуінде жоғары мен төмен бар (субординация), тек достық тең.</p>",
"<p>Ли тек сыртқы форма емес: ішкі жэнь (адамгершілік) болмаса, рәсім бос қауыз болып қалады. Аспанға, ата-бабаға, ұстазға бас июдің бәрі осыдан шыққан.</p><div class='fact'><b>Қызықты:</b> Цин сарайында императордың алдында «үш рет тізерлеп, тоғыз рет бас ұру» рәсімі орындалған. Шетелдік елшілердің осыны орындаудан бас тартуы дипломатиялық дауға себеп болған.</div>"]},
hier:{t:"Иероглиф және каллиграфия",s:"Жазу да философия",n:[1,3,6],p:[
"<p>Қытай иероглифтері — ойдың суреті. <b class='cn'>道</b> (дао) белгісінде «бас» пен «жүру» бар: ойланып жүріп өтетін жол. <b class='cn'>仁</b> (жэнь, адамгершілік) «адам» мен «екі» белгісінен тұрады: адамгершілік екі адамның арасында пайда болады.</p><p>Қытай жазуының ең ерте үлгілері — шамамен б.з.д. 1200 жылдардағы сүйек пен тасбақа қабығына жазылған болжам жазулары.</p>",

terra:{t:"Терракота армиясы: о дүниедегі император",s:"Цинь Шихуан қабірі (б.з.д. 210)",n:[0,1,4,7],p:[
"<p>Қытайлар о дүниені осы өмірдің жалғасы деп білген. Император о дүниеге де «Көк Аспанның ұлы» (Тянь-цзы) ретінде барады, сондықтан ол жақта да оған адал қызмет ететін армия, сарай мүшелері, қызметшілер мен мемлекеттік құрылым қажет деген сенім болды.</p><p>Осы сенімнің ең ұлы айғағы — Цинь Шихуан қабірін күзететін терракота армиясы: жаяу сарбаздар, садақшылар, атты әскер, соғыс арбалары.</p>",
"<p>Мыңдаған сарбаз мүсіні табылған (шамамен 8000 деп болжанады). Әрқайсысының жүзі, шашы, киімі әртүрлі. Бастапқыда олар ашық бояумен боялған, қолдарында нағыз қола қару болған.</p><div class='fact'><b>Қызықты:</b> Армияны 1974 жылы Сиань маңында құдық қазған шаруалар кездейсоқ тапты. Сыма Цянь қабір ішінде сынаптан жасалған өзендер болған деп жазған. Жеке шұңқырлардан шенеуніктер, музыканттар мен акробаттардың мүсіндері де табылған: бұл — о дүниеге көшірілген тұтас мемлекеттік құрылым.</div>"]},
legal:{t:"Легизм және императордың абсолютті билігі",s:"Шан Ян, Хань Фэй, Цинь Шихуан",n:[0,4,6],p:[
"<p>Легизм (фацзя) — «заң» туралы ілім, ерте қытайдағы саяси-этикалық ілім. Өкілдері: Цзы Чань (б.з.д. VI ғ.), Гуань Чжун, Шан Ян (б.з.д. 390–338), Хань Фэй цзы (шамамен б.з.д. 280–233) және т.б.</p><p>Конфуцийшілдер <b>жэнь</b> мен <b>ли</b> принципін ұсынса, легистер оның орнына заңға (<b>фа</b>) сүйенген мемлекеттік реформа ұсынды. Мемлекетті тек заң басқаруы керек, мақсат — елде тәртіп орнату.</p>",
"<p>Хань Фэй бойынша билеуші үш нәрсеге сүйенеді: заң (фа), басқару әдісі (шу) және билік (ши). Жаза мен сыйлық — билеушінің қолындағы «екі тұтқа». Заң бәріне бірдей, ал билік жалғыз императордың қолында болуы тиіс.</p><p>Ежелгі Қытай мемлекеті шын мәніндегі шығыстық деспотия болды. Осы теория абсолютті билікке ғылыми негіз берді.</p>",
"<p>Легизмге сүйенген Цинь мемлекеті б.з.д. 221 жылы Қытайды біріктіріп, Цинь Шихуан алғашқы император атанды: жазу, өлшем, ақша бірыңғай болды.</p><div class='fact'><b>Қызықты:</b> Кейінгі Хань империясы конфуцийшілдікті ресми идеологияға айналдырды, бірақ легистік заң әдістерін қалдырды. Тарихшылар мұны «сырты конфуцийшіл, іші легист» деп атайды.</div>"]},
keju:{t:"Мемлекеттік емтихан жүйесі",s:"Шенеунік болудың жолы",n:[2,4,5],p:[
"<p>Император жалғыз билеуші болса, елді шенеуніктер басқарды. Қытайда шенеунікті туған тегіне емес, білімге қарай таңдау идеясы дамыды. Конфуцийшілдік «Төрт кітап» пен «Бес классиканы» жаттау мансапқа апаратын жол болды.</p>",

def:{t:"Қытай философиясы дегеніміз не?",s:"Кіріспе",n:[0,2,4],p:[

six:{t:"Алты ағым: сапар картасы",s:"Жүз мектептің негізгілері",n:[0,3,5],p:[

legal:{t:"Легизм және императордың абсолютті билігі",s:"Шан Ян, Хань Фэй, Цинь Шихуан",n:[0,4,6],p:[
"<p>Легизм (фацзя) — «заң» туралы ілім, ерте қытайдағы саяси-этикалық ілім. Өкілдері: Цзы Чань (б.з.д. VI ғ.), Гуань Чжун, Шан Ян (б.з.д. 390–338), Хань Фэй цзы (шамамен б.з.д. 280–233) және т.б.</p><p>Конфуцийшілдер <b>жэнь</b> мен <b>ли</b> принципін ұсынса, легистер оның орнына заңға (<b>фа</b>) сүйенген мемлекеттік реформа ұсынды. Мемлекетті тек заң басқаруы керек, мақсат — елде тәртіп орнату.</p>",
"<p>Хань Фэй бойынша билеуші үш нәрсеге сүйенеді: заң (фа), басқару әдісі (шу) және билік (ши). Жаза мен сыйлық — билеушінің қолындағы «екі тұтқа». Заң бәріне бірдей, ал билік жалғыз императордың қолында болуы тиіс: осылайша абсолютті билік теориялық негіз алды.</p>",
"<p>Легизмге сүйенген Цинь мемлекеті б.з.д. 221 жылы Қытайды біріктіріп, Цинь Шихуан алғашқы император атанды: жазу, өлшем, ақша бірыңғай болды.</p><div class='fact'><b>Қызықты:</b> Цзы Чань б.з.д. 536 жылы заңды қола ыдыстарға құйып, халыққа көрсеткен: заң құпия болмауы тиіс. Кейінгі Хань империясы конфуцийшілдікті ресми идеологияға айналдырды, бірақ легистік әдістерді қалдырды.</div>"]},
wall:{t:"Ұлы Қытай қорғаны",s:"Біріктірілген мемлекеттің шекарасы",n:[4,2,0],p:[
"<p>Цинь Шихуан біріккен елдің солтүстігіндегі бұрынғы қорғандарды жалғап, бірыңғай қорғаныс жүйесін құрды. Жүздеген мың адамды жұмылдыру мүмкін болғаны — легизмнің қатаң заңы мен орталықтанған басқарудың нәтижесі.</p>",
"<p>Қорған екі әлемді ажыратты: бір жағында «мәдениетті» Қытай, екінші жағында көшпенділер. Қытай дүниетанымында орталық пен оның төңірегі арасындағы шекара — ли мен тәртіптің шекарасы.</p><div class='fact'><b>Қызықты:</b> Бүгін көрінетін қорғанның көп бөлігін Мин әулеті (1368–1644) салған. Цинь заманындағы қорғандардың көбі топырақтан соғылғандықтан сақталмаған.</div>"]},
wudang:{t:"Удан тауы: даос шыңдары",s:"Табиғатпен үндесу",n:[1,3,6],p:[
"<p>Хубэй өлкесіндегі Удан тауында даос ғибадатханалары тау жотасына орналасқан. Даосшылар тауды Дао мен Ци шоғырланған қасиетті жер деп санаған: адам табиғаттан бөлек емес, оның бір бөлігі.</p>",
"<p>Даос практикасының мақсаты — денеде Ци ағысын үйлестіру: баяу қозғалыс, тыныс жаттығулары, ой тыныштығы.</p><div class='fact'><b>Қызықты:</b> Аңыз бойынша тайцзицюань жекпе-жегін Удан тауында даос Чжан Саньфэн тырна мен жыланның айқасын көріп шығарған. Удан ғибадатханалары 1994 жылы ЮНЕСКО тізіміне енген.</div>"]},
qufu:{t:"Цюйфу: Конфуций жұрты",s:"Ғибадатхана мен шежіре",n:[2,4,7],p:[
"<p>Шаньдун өлкесіндегі Цюйфу — Конфуцийдің туған қаласы. Мұнда Конфуций ғибадатханасы, Кун отбасының үйі мен зираты бір кешенді құрайды. Ол 1994 жылы ЮНЕСКО тізіміне енген.</p>",
"<p>Ғасырлар бойы император сарайлары Цюйфуға ұстазға тағзым ету рәсімін өткізіп тұрған.</p><div class='fact'><b>Қызықты:</b> Кун әулетінің шежіресі 2000 жылдан астам үзілмей жүргізіліп келеді және әлемдегі ең ұзақ шежірелердің бірі саналады. Бұл — сяо (ата-бабаға құрмет) қағидасының тірі айғағы.</div>"]},
end:{t:"Сапар қорытындысы",s:"Талқылауға арналған сұрақтар",n:[0,2,4,7],p:[
"<p>Сіз Қытай философиясының анықтамасынан бастап, оның мектептері мен ескерткіштеріне дейін өттіңіз. Енді ойланайық:</p><p><b>1.</b> Жэнь мен заң (фа) қоғамды қалай әртүрлі басқарады?</p><p><b>2.</b> «У вэй» қағидасы бүгінгі өмірде қайда көрінеді?</p><p><b>3.</b> Терракота армиясы қытайлықтардың о дүние туралы қандай көзқарасын көрсетеді?</p><p><b>4.</b> Қай ойшылмен келісесіз және неге?</p>"]}
});
D.keju.p[0]="<p>Елді жалғыз билеуші емес, шенеуніктер басқарды. Қытайда шенеунікті туған тегіне емес, білімге қарай таңдау идеясы дамыды. Конфуцийшілдік «Төрт кітап» пен «Бес классиканы» жаттау мансапқа апаратын жол болды.</p>";
